# FirstFood - public entry point.   https://firstfood.store
#
#   /            -> Next.js  (customer portal: login + customer app)
#   /staff       -> Next.js  (staff portal:    login + staff app)
#   /api/v1/...  -> Spring Boot (one shared API; staff endpoints live under /api/v1/staff/...)
#
# TLS terminates here. Backend, Postgres and Redis/Valkey are NOT published to the host: they are reachable only on
# the internal `data` docker network (see deploy/docker-compose.prod.yml). Replace firstfood.store everywhere.

# F-16: do not advertise the nginx version in the Server header or on error pages.
server_tokens off;

# ---- rate limiting (per client IP; nginx sees the real address, Spring does not) -------------------------------
# OTP requests send an SMS, so they get the tightest limit (the backend also limits per phone: 5/hour).
limit_req_zone $binary_remote_addr zone=fp_otp:10m   rate=6r/m;
limit_req_zone $binary_remote_addr zone=fp_auth:10m  rate=20r/m;   # signin / signup / refresh / logout
limit_req_zone $binary_remote_addr zone=fp_api:10m   rate=20r/s;

# ---- real client address (F-01) ---------------------------------------------------------------------------------
# Every limit below, and the backend's per-IP limits (it reads the X-Forwarded-For set further down), are only as good
# as $remote_addr. Directly on the internet it is the real client. If a CDN or load balancer sits IN FRONT of this
# nginx, $remote_addr is that device, so every user would share one bucket again. Then uncomment and list ONLY that
# device's ranges (never 0.0.0.0/0), and use the header it documents:
#   set_real_ip_from  <cdn-or-lb-cidr>;
#   real_ip_header    X-Forwarded-For;      # or CF-Connecting-IP / X-Real-IP, per your provider
#   real_ip_recursive on;

upstream fp_frontend { server frontend:3000; keepalive 16; }
upstream fp_backend  { server backend:8080;  keepalive 16; }

# ---- :80 -> https (and ACME challenges for certbot) -------------------------------------------------------------
server {
    listen 80;
    server_name firstfood.store www.firstfood.store;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- :443 -------------------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name firstfood.store www.firstfood.store;

    ssl_certificate     /etc/letsencrypt/live/firstfood.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firstfood.store/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # F-16: ONE HSTS policy, owned by this edge and identical to the fallback in next.config.js: one year, and
    # deliberately WITHOUT includeSubDomains/preload (add those only once every subdomain is confirmed HTTPS-ready; a
    # browser cannot be told to forget it). Upstream copies are dropped so the client never sees two policies.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Shared proxy settings. Forwarded headers are OVERWRITTEN (not appended) because this is the edge: whatever a
    # client sent in X-Forwarded-* must never reach the apps.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # ---- API: Spring Boot ----------------------------------------------------------------------------------------
    # Most specific first. limit_req_status makes a limited request a 429, matching the backend's own OTP limit.
    # F-16: EVERY route that sends a code (SMS or email) is in the tight zone, not just the login one: login, phone
    # change, email change, and the owner step-up code (both URL prefixes the backend maps). The backend's own per-phone
    # and per-account limits still apply on top. A regex location wins over the plain `/api/v1/auth/` prefix below.
    location ~ ^/api/v1/(auth/otp/request|me/phone/otp/request|me/email/otp/request|(staff/)?providers/[^/]+/owner-step-up)$ {
        limit_req zone=fp_otp burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://fp_backend;
    }

    location /api/v1/auth/ {
        limit_req zone=fp_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://fp_backend;
    }

    location /api/ {
        limit_req zone=fp_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://fp_backend;
    }

    # Actuator/health stays internal (docker healthchecks talk to the container directly).
    location /actuator/ { return 404; }

    # ---- Staff portal: Next.js (same app as the customer portal, different route tree) ---------------------------
    location ^~ /staff {
        proxy_pass http://fp_frontend;
    }

    # ---- Customer portal + everything else: Next.js -------------------------------------------------------------
    location / {
        proxy_pass http://fp_frontend;
    }
}
