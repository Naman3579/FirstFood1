name: CI

on:
  push:
    branches: [RefreshSession]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean verify

  # F-04: backend and container images were never scanned. Trivy covers Maven dependencies (pom.xml) and, below,
  # the built images. Fails the build on HIGH/CRITICAL findings that have a fix available.
  compose-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Production Compose keeps the tiers apart (F-10)
        run: infra/scripts/verify-compose-topology.sh

  # F-16: edge and image settings that are easy to regress silently (HSTS, server_tokens, OTP rate-limit coverage,
  # production-only node_modules in the frontend image). Reads files only.
  edge-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Edge config and frontend image (F-16)
        run: infra/scripts/verify-edge-config.sh

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan Maven and npm dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image-scan:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            build-args: ""
          - name: frontend
            context: frontend
            build-args: |
              NEXT_PUBLIC_API_BASE_URL=
              BACKEND_ORIGIN=http://backend:8080
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: firstfood-${{ matrix.name }}:ci
          build-args: ${{ matrix.build-args }}
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: firstfood-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build (direct mode - rollback path must keep working)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build
      - name: Build (same-origin proxy mode)
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
          BACKEND_ORIGIN: http://localhost:8080
        run: npm run build
      - name: Proxy smoke test (stub backend, built app)
        run: npm run smoke:proxy
      - name: Dependency audit (production deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (all deps incl. dev tooling, fail on high/critical)
        run: npm audit --audit-level=high
      - name: Build (direct mode with cookie-less rollback config still passes headers config)
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: npm run build
