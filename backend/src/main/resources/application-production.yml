# All secrets/connection details come from environment variables - never
# committed values (rules.md Rule 17.3 - never expose secrets).
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Budget this from the database tier's connection limit: (instances x DB_POOL_SIZE) + workers + admin tools.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail a request in 5s instead of queueing it forever when the pool is exhausted.
      connection-timeout: 5000
      data-source-properties:
        # Server-side guards so one bad query or abandoned transaction cannot pin a connection.
        options: "-c statement_timeout=15000 -c idle_in_transaction_session_timeout=30000"
        # Client-side socket timeout (seconds) in case the server never answers at all.
        socketTimeout: 30
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${REDIS_URL}

management:
  endpoint:
    health:
      show-details: never

app:
  rate-limit:
    # F-01: no default on purpose (same pattern as CORS_ALLOWED_ORIGINS / JWT_SECRET). Behind a reverse proxy an unset
    # value silently turns every per-IP limit into ONE site-wide bucket. Set it to the proxy hop(s), e.g. the nginx
    # container address (172.28.10.2/32). Set it to an empty string ONLY if the backend is directly exposed.
    trusted-proxies: ${TRUSTED_PROXY_CIDRS}
  auth:
    legacy-login:
      # F-12: pinned, no environment override. The portal-less login never creates accounts in production.
      register-new-accounts: false
  bot-challenge:
    # F-05: ON by default in production, so forgetting to configure it fails startup (no TURNSTILE_SECRET_KEY) instead of
    # silently leaving the public OTP endpoint open to SMS pumping. Turn it off only on purpose: BOT_CHALLENGE_ENABLED=false.
    enabled: ${BOT_CHALLENGE_ENABLED:true}
  notifications:
    brevo:
      api-key: ${BREVO_API_KEY}
      sender-name: ${BREVO_SMS_SENDER_NAME:FirstFood}
  cors:
    # No default on purpose, same pattern as JWT_SECRET: production must
    # fail startup rather than silently allow the local-dev origin (or
    # worse, nothing) through CORS. Comma-separated if more than one.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  structured:
    format:
      # One JSON object per log line (includes the requestId from MDC), ready for any log platform.
      console: logstash
  level:
    "[com.firstfood]": INFO
    root: WARN
